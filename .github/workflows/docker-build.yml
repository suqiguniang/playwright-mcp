name: Build and Push Docker Image

on:
  push:
    branches: [ "master" ]  # 当 master 分支有推送时触发
    # 你也可以添加 tag 触发，例如：
    # tags:
    #   - 'v*' 
  workflow_dispatch: # 允许手动触发构建

env:
  # 请根据你的需求修改镜像名称
  IMAGE_NAME: playwright-mcp 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 QEMU (用于多平台构建，可选)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. 登录到容器仓库 (以 GitHub Container Registry 为例)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # 需要使用 Personal Access Token (PAT) 或 secrets.GITHUB_TOKEN
          password: ${{ secrets.GITHUB_TOKEN }} 

      # 5. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./build          # 指向 build 目录
          file: ./build/Dockerfile  # 明确指定 Dockerfile 路径
          push: true                # 推送到仓库
          # 设置标签，例如: ghcr.io/<你的用户名>/playwright-mcp:latest
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # 可选：添加构建参数
          # build-args: |
          #   SOME_ARG=value
